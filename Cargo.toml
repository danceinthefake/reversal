[package]
name = "reversal"
version = "0.1.0"
edition = "2021"

[dependencies]
axum = "0.8"
tokio = { version = "1", features = ["full"] }
sqlx = { version = "0.8", features = ["runtime-tokio", "postgres", "sqlite"] }
dotenvy = "0.15"
tower-http = { version = "0.6", features = ["trace"] }
tracing = "0.1"
tracing-subscriber = { version = "0.3", features = ["env-filter"] }

# Pin crates for Rust 1.84 compatibility
base64ct = "=1.7.3"
const-oid = "=0.9.6"
pem-rfc7468 = "=0.7.0"
home = "=0.5.11"
