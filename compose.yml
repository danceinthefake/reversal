services:
  db:
    image: postgres:16-alpine
    restart: unless-stopped
    environment:
      POSTGRES_DB: ${POSTGRES_DB:-reversal}
      POSTGRES_USER: ${POSTGRES_USER:-postgres}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:-secret}
    volumes:
      - postgres_data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U postgres"]
      interval: 10s
      timeout: 5s
      retries: 5

  app:
    build: .
    image: reversal:latest
    restart: unless-stopped
    ports:
      - "${PORT:-3000}:3000"
    environment:
      DB_TYPE: ${DB_TYPE:-postgresql}
      DATABASE_URL: ${DATABASE_URL:-postgres://postgres:secret@db/reversal}
    volumes:
      - sqlite_data:/app/data
    depends_on:
      db:
        condition: service_healthy

volumes:
  postgres_data:
  sqlite_data:
